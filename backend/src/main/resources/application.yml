server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-maintenance-system
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-file-size-bytes: 10485760             # 10MB
  groq:
    endpoint: ${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    timeout-ms: ${GROQ_TIMEOUT_MS:15000}
    max-retries: ${GROQ_MAX_RETRIES:2}
  priority:
    urgency-base:
      low: 10
      medium: 30
      high: 55
      critical: 80
    aging-divisor: 6
    max-aging-bonus: 20
    recurrence-multiplier: 5
    max-recurrence-bonus: 15
  recurrence:
    window-days: 30
    threshold: 2
  escalation:
    critical-unassigned-minutes: 30
    sla-hours:
      critical: 4
      high: 24
      medium: 72
      low: 168

resilience4j:
  circuitbreaker:
    instances:
      groqClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 15s
        failure-rate-threshold: 50
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.RestClientException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
