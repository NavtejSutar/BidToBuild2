services:
  mysql:
    image: mysql:8.0
    container_name: campus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bidtobid}
      MYSQL_USER: ${MYSQL_USER:-nav}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-navdiv123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bidtobid}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-nav}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-navdiv123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://campus-maintenance.example.edu}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - campus_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: campus_frontend
    restart: unless-stopped
    networks:
      - campus_net

  nginx:
    image: nginx:alpine
    container_name: campus_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - uploads_data:/var/www/uploads:ro
    networks:
      - campus_net

volumes:
  mysql_data:
  uploads_data:
  certbot_etc:
  certbot_var:

networks:
  campus_net:
    driver: bridge
